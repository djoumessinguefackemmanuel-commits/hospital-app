name: backend-ci
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: hms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hms:hms@localhost:5432/hms
      TEST_DATABASE_URL: postgresql://hms:hms@localhost:5432/hms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Migration SQL
        run: PGPASSWORD=hms psql -h localhost -U hms -d hms -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261127000000_init/migration.sql
      - name: Migration SQL patient
        run: PGPASSWORD=hms psql -h localhost -U hms -d hms -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261127100000_patient/migration.sql
      - name: Migration SQL fusion
        run: PGPASSWORD=hms psql -h localhost -U hms -d hms -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261127110000_patient_merge/migration.sql
      - name: Migration SQL consultation
        run: PGPASSWORD=hms psql -h localhost -U hms -d hms -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261127120000_consultation/migration.sql
      - name: Migration SQL notifications
        run: PGPASSWORD=hms psql -h localhost -U hms -d hms -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261128000000_notifications/migration.sql
      - name: Seed
        run: npx tsx prisma/seed/index.ts
        env:
          SEED_ADMIN_EMAIL: ci-admin@hms.local
          SEED_ADMIN_PASSWORD: Ci-Admin!2026-Throwaway
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run deps:check
      - run: npx jest --coverage --runInBand
