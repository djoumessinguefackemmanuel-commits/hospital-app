# Environnement local uniquement. Les mots de passe sont des valeurs de développement.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: hms, POSTGRES_PASSWORD: hms, POSTGRES_DB: hms }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: change-me, MINIO_ROOT_PASSWORD: change-me-too }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata: {}
  miniodata: {}
